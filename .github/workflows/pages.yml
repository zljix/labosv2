name: Objavi laboratorij na GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run test:school-pilot
      - name: Provjeri raspored vodiča
        run: npm run test:routing
      - name: Izgradi laboratorij za putanju repozitorija
        run: npm run build:pages
        env:
          LAB_BASE_PATH: /${{ github.event.repository.name }}/
      - name: Provjeri resurse i offline rad na podputanji
        run: node --test verification/pages.test.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Objavi web aplikaciju
        id: deployment
        uses: actions/deploy-pages@v4
