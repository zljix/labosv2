name: Objavi laboratorij na GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm ci --prefix prototypes/avr-offline/ci
      - name: Pripremi Chromium za prihvat
        run: prototypes/avr-offline/ci/node_modules/.bin/playwright install --with-deps chromium
      - name: Izgradi offline prevoditelj i pripadajuće izvore
        run: npm run prototype:avr:build
      - name: Provjeri dostupnost zaključanih izvora i recepata
        run: npm run prototype:avr:sources
      - name: Provjeri ponovljivost alata i SDK-a
        run: git diff --exit-code -- prototypes/avr-offline/runtime-manifest.json prototypes/avr-offline/packed-manifest.json prototypes/avr-offline/core-build-manifest.json prototypes/avr-offline/library-build-manifest.json
      - name: Provjeri datoteke, kartice i radni prostor
        run: npm run test:workspace
      - run: npm run test:school-pilot
      - run: npm run test:offline-ui
      - run: node --test verification/offline-storage.test.mjs
      - name: Provjeri raspored vodiča
        run: npm run test:routing
      - name: Izgradi laboratorij za putanju repozitorija
        run: npm run build:pages
        env:
          LAB_BASE_PATH: /${{ github.event.repository.name }}/
          LAB_OFFLINE_AVR: '1'
      - name: Provjeri resurse i offline rad na podputanji
        run: node --test verification/pages.test.mjs
      - name: Provjeri prevoditelj, projekte i simulaciju
        run: |
          node --import tsx --test prototypes/avr-offline/compiler.test.mjs prototypes/avr-offline/worker-harness.test.mjs prototypes/avr-offline/package.test.mjs prototypes/avr-offline/network-proof.test.mjs prototypes/avr-offline/project-bridge.test.ts prototypes/avr-offline/libraries.test.ts prototypes/avr-offline/release-check.test.mjs prototypes/avr-offline/distribution.test.mjs verification/offline-avr.test.ts verification/project.test.ts verification/circuit.test.ts verification/arduino.test.ts verification/avr.test.ts
          npm run test:compiler-ui
      - name: Izgradi prethodno objavljeni labosv2 za provjeru nadogradnje
        run: |
          git fetch --depth=1 origin e5e65297ef23a5cd18497f956f1d3a702add7afe
          git worktree add --detach .build/upgrade-baseline e5e65297ef23a5cd18497f956f1d3a702add7afe
          npm ci --prefix .build/upgrade-baseline
          cd .build/upgrade-baseline
          LAB_BASE_PATH=/labosv2/ npm run build:pages
      - name: Nadogradi postojeći profil bez brisanja predmemorije
        run: node prototypes/avr-offline/integrated-browser-test.mjs prepare
        env:
          LAB_UPGRADE_BASELINE: .build/upgrade-baseline/dist
      - name: Prevedi novi izvor i ponovi restart bez mreže
        run: |
          test_runner_user="$(id -un)"
          test_node_path="$(command -v node)"
          sudo unshare --net -- runuser -u "$test_runner_user" -- "$test_node_path" prototypes/avr-offline/integrated-browser-test.mjs isolated
      - name: Sačuvaj dokaze prihvata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Labos-0.16.0-beta.1-acceptance
          path: |
            .build/avr-integrated-evidence/
            .build/avr-prototype-node-evidence.json
            .build/avr-library-evidence.json
          retention-days: 30
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Objavi web aplikaciju
        id: deployment
        uses: actions/deploy-pages@v4
