<h1>ESP32-S3 · offline prototip</h1><p>GPIO4 → 330 Ω → LED → GND. Promijeni trajanje odgode ili tekst pa pokreni četiri prolaza kroz loop().</p>
<label for="code">main.ino</label><textarea id="code" rows="14" spellcheck="false">void setup() {
  pinMode(4, OUTPUT);
  Serial.begin(9600);
}

void loop() {
  digitalWrite(4, HIGH);
  Serial.println("LED ukljucena");
  delay(300);
  digitalWrite(4, LOW);
  delay(300);
}</textarea>
<button id="prepare">Spremi za offline rad (~108 MiB)</button><button id="run">Prevedi i pokreni</button><button id="stop" disabled>Prekini</button>
<output id="status" role="status"></output><p><span id="led"></span> LED · <span id="time">0</span> ms</p><pre id="serial" aria-label="Serijski ispis"></pre>
